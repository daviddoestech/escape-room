<!DOCTYPE html>
<html>
<head>
    <title>Escape Room</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <!--дивз за собата-->
<div id="room">

    <div id="player"></div>

    <div id="desk" class="obj">Биро</div>
    <div id="note" class="obj">Белешка</div>
    <div id="tv" class="obj">ТВ</div>
    <div id="lamp" class="obj">Ламба</div>
    <div id="safe" class="obj">Сеф</div>
    <div id="pc" class="obj">Компјутер</div>
    <div id="door" class="obj">Врата</div>

</div>
<!--див за UI на инструкциите за контроли
<div id="ui">
    <div id="text">Движење: WASD / E за користење</div>
    <div id="controls"></div>
</div>
<!--див за победа-->
<div id="win">
    🎉 УСПЕА ДА ИЗБЕГАШ!
</div>

<script src="script.js"></script>

</body>
</html>
